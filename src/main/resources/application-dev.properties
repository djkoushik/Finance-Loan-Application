# Debugging in Eclipse: use with VM/program argument  --spring.profiles.active=dev
# Don't open a browser window and tray icon on every debug start
finance.open-window=false

# Use a separate database so debugging never touches the real data folder
# (use the same ./data to debug against your real data)
finance.data-dir=./data-dev
finance.db-port=54330
finance.photo-dir=./data-dev/photos
finance.backup-dir=./data-dev/backups

# Verbose logging for the app and SQL
logging.level.com.rajarajeshwari.finance=DEBUG
logging.level.org.springframework.jdbc.core=DEBUG